<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledgerly — Учёт и финансы</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💠</text></svg>">
<!-- Firebase SDK (compat, CDN) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-functions-compat.js"></script>
<!-- Chart.js for reports/dashboard graphs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f8fafc;
  --border:#e4e8f0; --border-strong:#d4dae5;
  --text:#111827; --text-dim:#5b6472; --text-faint:#93a0b4;
  --brand:#4f5fff; --brand-dark:#3d4be0; --brand-light:#eef0ff;
  --success:#16a34a; --success-light:#eafbf1;
  --danger:#e0344c; --danger-light:#fdeaee;
  --warn:#e2a336; --warn-light:#fef6e7;
  --info:#2f8fe0; --info-light:#e9f4fd;
  --radius-sm:8px; --radius:12px; --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(20,25,40,.06);
  --shadow:0 4px 16px rgba(20,25,40,.08);
  --shadow-lg:0 12px 40px rgba(20,25,40,.14);
  --sidebar-w:250px;
  font-size:15px;
}
:root[data-theme="dark"]{
  --bg:#0f1117; --surface:#171a23; --surface-2:#1d212c;
  --border:#262b38; --border-strong:#333a4a;
  --text:#eef1f6; --text-dim:#a3acbf; --text-faint:#636c80;
  --brand-light:#232748;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
img{max-width:100%;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:10px;}

/* ---------- utility ---------- */
.hidden{display:none !important;}
.flex{display:flex;}
.flex-col{display:flex; flex-direction:column;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;}
.w-full{width:100%;}
.text-dim{color:var(--text-dim);}
.text-sm{font-size:13px;}
.mt-2{margin-top:8px;} .mt-3{margin-top:12px;} .mt-4{margin-top:16px;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 16px; border-radius:var(--radius-sm); border:1px solid transparent;
  font-size:14px; font-weight:600; transition:all .15s ease; white-space:nowrap;
  min-height:40px;
}
.btn-primary{background:var(--brand); color:#fff;}
.btn-primary:hover{background:var(--brand-dark); transform:translateY(-1px);}
.btn-secondary{background:var(--surface-2); color:var(--text); border-color:var(--border);}
.btn-secondary:hover{background:var(--border);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-danger:hover{filter:brightness(.92);}
.btn-ghost{background:transparent; color:var(--text-dim);}
.btn-ghost:hover{background:var(--surface-2); color:var(--text);}
.btn-sm{padding:6px 10px; min-height:32px; font-size:13px; border-radius:7px;}
.btn-icon{padding:8px; min-width:36px; min-height:36px;}
.btn:disabled{opacity:.55; cursor:not-allowed; transform:none !important;}
.btn .spinner{width:15px; height:15px;}

/* ---------- spinner ---------- */
.spinner{
  width:20px; height:20px; border-radius:50%;
  border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff;
  animation:spin .7s linear infinite;
}
.spinner.dark{border-color:rgba(79,95,255,.2); border-top-color:var(--brand);}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- cards / surfaces ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);}
.card-pad{padding:20px;}

/* ---------- forms ---------- */
label{display:block; font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
input,select,textarea{
  width:100%; padding:10px 12px; border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  background:var(--surface); color:var(--text); font-size:14px; font-family:inherit;
  transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-light);}
.field{margin-bottom:16px;}
.field-error{color:var(--danger); font-size:12px; margin-top:4px;}
.input-error{border-color:var(--danger) !important;}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

/* ---------- badges ---------- */
.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:700;}
.badge-success{background:var(--success-light); color:var(--success);}
.badge-danger{background:var(--danger-light); color:var(--danger);}
.badge-warn{background:var(--warn-light); color:#96731c;}
.badge-info{background:var(--info-light); color:var(--info);}
.badge-gray{background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);}

/* ---------- app shell ---------- */
#app{height:100%;}
.page{min-height:100%;}
.app-shell{display:flex; height:100vh; height:100dvh; overflow:hidden;}

/* sidebar */
.sidebar{
  width:var(--sidebar-w); background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; flex-shrink:0; transition:transform .25s ease;
}
.sidebar-logo{display:flex; align-items:center; gap:10px; padding:20px 18px; font-weight:800; font-size:17px;}
.sidebar-logo .mark{width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--brand),#8b7bff); display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px;}
.sidebar-nav{flex:1; overflow-y:auto; padding:6px 12px 16px;}
.nav-group-title{font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); padding:16px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:9px; color:var(--text-dim);
  font-size:14px; font-weight:600; margin-bottom:2px; transition:background .12s, color .12s;
}
.nav-item .ic{width:19px; text-align:center; font-size:15px;}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--brand-light); color:var(--brand);}

/* header */
.topbar{
  height:62px; flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; padding:0 20px; gap:14px;
}
.topbar-search{position:relative; flex:1; max-width:420px;}
.topbar-search input{padding-left:36px; background:var(--surface-2); border-color:var(--border);}
.topbar-search .ic{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-faint);}
.search-dropdown{
  position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow-lg); max-height:340px; overflow-y:auto; z-index:60;
}
.search-result{display:flex; justify-content:space-between; padding:10px 14px; font-size:13.5px; border-bottom:1px solid var(--border);}
.search-result:hover{background:var(--surface-2);}
.search-result:last-child{border-bottom:none;}

.topbar-actions{display:flex; align-items:center; gap:6px;}
.icon-btn{
  width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  color:var(--text-dim); position:relative; font-size:16px;
}
.icon-btn:hover{background:var(--surface-2); color:var(--text);}
.dot-badge{position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--danger); border:1.5px solid var(--surface);}

.dropdown-menu{
  position:absolute; top:100%; right:0; margin-top:8px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow-lg); min-width:200px; padding:6px; z-index:70;
}
.dropdown-item{display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px; font-size:13.5px; font-weight:500;}
.dropdown-item:hover{background:var(--surface-2);}
.rel{position:relative;}

.profile-chip{display:flex; align-items:center; gap:9px; padding:5px 10px 5px 5px; border-radius:99px;}
.profile-chip:hover{background:var(--surface-2);}
.avatar{width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--brand),#8b7bff); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;}

/* main content */
.main-scroll{flex:1; overflow-y:auto; padding:24px;}
.page-header{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:20px;}
.page-title{font-size:22px; font-weight:800;}
.page-sub{color:var(--text-dim); font-size:13.5px; margin-top:2px;}

/* mobile drawer */
.drawer-overlay{position:fixed; inset:0; background:rgba(10,12,20,.5); z-index:90; opacity:0; pointer-events:none; transition:opacity .2s;}
.drawer-overlay.show{opacity:1; pointer-events:auto;}
.hamburger{display:none;}

@media (max-width:900px){
  .sidebar{position:fixed; z-index:95; top:0; bottom:0; left:0; transform:translateX(-100%); box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:flex;}
  .form-row{grid-template-columns:1fr;}
  .topbar-search{max-width:none;}
  :root{--sidebar-w:250px;}
}

/* ---------- stat cards ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:20px;}
.stat-card{padding:18px; display:flex; flex-direction:column; gap:8px;}
.stat-card .stat-top{display:flex; justify-content:space-between; align-items:flex-start;}
.stat-card .stat-ic{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px;}
.stat-card .stat-value{font-size:24px; font-weight:800;}
.stat-card .stat-label{color:var(--text-dim); font-size:13px; font-weight:600;}
.stat-card .stat-delta{font-size:12px; font-weight:700;}

.chart-grid{display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-bottom:20px;}
@media (max-width:900px){.chart-grid{grid-template-columns:1fr;}}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; min-width:600px;}
thead th{
  text-align:left; font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
  color:var(--text-faint); padding:12px 16px; border-bottom:1px solid var(--border); white-space:nowrap;
}
tbody td{padding:13px 16px; font-size:13.5px; border-bottom:1px solid var(--border);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.row-actions{display:flex; gap:4px; opacity:.85;}

/* toolbar */
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px;}
.toolbar .grow{flex:1; min-width:180px;}
.chip-filter{display:flex; gap:6px; flex-wrap:wrap;}
.chip{padding:7px 13px; border-radius:99px; font-size:12.5px; font-weight:700; background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);}
.chip.active{background:var(--brand); color:#fff; border-color:var(--brand);}

/* modal */
.modal-overlay{position:fixed; inset:0; background:rgba(10,12,20,.5); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px; opacity:0; pointer-events:none; transition:opacity .18s;}
.modal-overlay.show{opacity:1; pointer-events:auto;}
.modal{background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg); transform:translateY(12px) scale(.98); transition:transform .18s;}
.modal-overlay.show .modal{transform:translateY(0) scale(1);}
.modal.modal-lg{max-width:760px;}
.modal-head{display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface);}
.modal-title{font-size:16px; font-weight:800;}
.modal-body{padding:22px;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--surface);}

/* toasts */
.toast-stack{position:fixed; top:16px; right:16px; z-index:400; display:flex; flex-direction:column; gap:10px; max-width:340px;}
@media (max-width:600px){.toast-stack{left:16px; right:16px; max-width:none;}}
.toast{
  background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--brand);
  border-radius:10px; padding:12px 14px; box-shadow:var(--shadow-lg); display:flex; gap:10px; align-items:flex-start;
  animation:toastIn .2s ease;
}
@keyframes toastIn{from{opacity:0; transform:translateX(24px);} to{opacity:1; transform:translateX(0);}}
.toast.success{border-left-color:var(--success);}
.toast.error{border-left-color:var(--danger);}
.toast.warning{border-left-color:var(--warn);}
.toast .toast-title{font-weight:700; font-size:13.5px;}
.toast .toast-msg{font-size:12.5px; color:var(--text-dim); margin-top:1px;}

/* skeleton */
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 37%,var(--surface-2) 63%); background-size:400% 100%; animation:skel 1.4s ease infinite; border-radius:6px;}
@keyframes skel{0%{background-position:100% 50%;} 100%{background-position:0 50%;}}

/* empty state */
.empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; padding:60px 20px; color:var(--text-dim);}
.empty-state .emoji{font-size:42px; margin-bottom:12px;}
.empty-state h3{color:var(--text); font-size:16px; margin-bottom:6px;}
.empty-state p{font-size:13.5px; max-width:320px; margin-bottom:16px;}

/* auth pages */
.auth-wrap{min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; background:linear-gradient(150deg,var(--brand) 0%,#8b7bff 100%); padding:20px;}
.auth-card{background:var(--surface); width:100%; max-width:400px; border-radius:20px; padding:34px 30px; box-shadow:var(--shadow-lg);}
.auth-logo{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px;}
.auth-logo .mark{width:52px; height:52px; border-radius:14px; background:linear-gradient(135deg,var(--brand),#8b7bff); display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px;}
.auth-logo h1{font-size:19px; font-weight:800;}
.auth-foot{text-align:center; font-size:13px; color:var(--text-dim); margin-top:16px;}
.otp-inputs{display:flex; gap:8px; justify-content:center; margin:6px 0 18px;}
.otp-inputs input{width:44px; height:52px; text-align:center; font-size:20px; font-weight:700;}

/* splash */
.splash{position:fixed; inset:0; background:linear-gradient(150deg,var(--brand) 0%,#8b7bff 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:500; color:#fff;}
.splash .mark{width:74px; height:74px; border-radius:20px; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; font-size:34px; animation:pulse 1.8s ease infinite;}
@keyframes pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.06);}}
.splash h1{font-size:22px; font-weight:800; letter-spacing:.02em;}
.splash .bar{width:160px; height:4px; border-radius:4px; background:rgba(255,255,255,.25); overflow:hidden;}
.splash .bar span{display:block; height:100%; width:40%; background:#fff; animation:load 1.1s ease-in-out infinite;}
@keyframes load{0%{margin-left:-40%;} 100%{margin-left:100%;}}

/* landing lang/theme mini switch on auth */
.mini-switch{position:fixed; top:16px; right:16px; display:flex; gap:8px; z-index:50;}
.mini-switch select{background:rgba(255,255,255,.18); color:#fff; border-color:rgba(255,255,255,.3); font-size:12.5px; padding:6px 8px; min-height:32px;}

/* misc */
.divider{height:1px; background:var(--border); margin:16px 0;}
.tab-bar{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; overflow-x:auto;}
.tab-btn{padding:11px 14px; font-size:13.5px; font-weight:700; color:var(--text-dim); border-bottom:2px solid transparent; white-space:nowrap;}
.tab-btn.active{color:var(--brand); border-color:var(--brand);}
.kv{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--border); font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-dim);}
.demo-banner{background:var(--warn-light); color:#96731c; padding:9px 16px; font-size:12.5px; font-weight:700; text-align:center;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toastStack" class="toast-stack"></div>
<div id="modalRoot"></div>

<script>
/* ============================================================
   PART 1: CONFIG
   ============================================================ */
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

// Cloud Function region/base used by TELEGRAM module (see instructions at bottom of chat response)
const CLOUD_FUNCTIONS_REGION = "us-central1";

// If Firebase cannot be reached (placeholder keys, offline, etc.) the app
// automatically falls back to DEMO MODE with in-memory sample data, so the
// UI is always explorable. Production deployments must fill in firebaseConfig above.
let DEMO_MODE = false;

/* ============================================================
   PART 2: FIREBASE INIT
   ============================================================ */
let auth, db, functions;
try{
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  functions = firebase.functions();
  if(firebaseConfig.apiKey === "YOUR_API_KEY"){
    // Placeholder config detected -> demo mode so the UI is always usable.
    DEMO_MODE = true;
  }
}catch(e){
  console.warn("Firebase init failed, falling back to DEMO MODE:", e);
  DEMO_MODE = true;
}

/* ============================================================
   PART 3: STATE
   ============================================================ */
const STATE = {
  user: null,            // {uid, firstName, lastName, login, role, lang, currency, telegramId, status}
  claims: null,          // custom claims from Firebase (admin: true/false)
  route: "splash",       // current page id
  lang: localStorage.getItem("ledgerly_lang") || "ru",
  currency: localStorage.getItem("ledgerly_currency") || "TJS",
  theme: localStorage.getItem("ledgerly_theme") || "light",
  sidebarOpen: false,
  exchangeRates: { TJS: 1, RUB: 1, USD: 1 }, // set by admin, relative to TJS base
  cache: {
    products: [], categories: [], customers: [], suppliers: [],
    sales: [], purchases: [], income: [], expenses: [],
    cashTx: [], bankTx: [], documents: [], notifications: [],
    users: [], auditLogs: []
  },
  unsub: [] // active firestore listeners to detach on logout
};
document.documentElement.setAttribute("data-theme", STATE.theme);

/* ============================================================
   PART 4: I18N
   ============================================================ */
const translations = {
  ru: {
    appName: "Ledgerly", tagline: "Учёт и финансы",
    login: "Логин", password: "Пароль", confirmPassword: "Повторите пароль",
    signIn: "Войти", signUp: "Регистрация", forgotPassword: "Забыли пароль?",
    firstName: "Имя", lastName: "Фамилия", telegramUsername: "Telegram Username / ID",
    getCode: "Получить код", verifyCode: "Подтвердить код", codeSentTo: "Код отправлен в Telegram",
    backToLogin: "Назад ко входу", createAccount: "Создать аккаунт", alreadyHaveAccount: "Уже есть аккаунт?",
    dontHaveAccount: "Нет аккаунта?",
    dashboard: "Dashboard", accounting: "Бухгалтерия", sales: "Продажи", purchases: "Покупки",
    income: "Доходы", expenses: "Расходы", cash: "Касса", bank: "Банк", products: "Товары",
    categories: "Категории", customers: "Контрагенты", documents: "Документы",
    reports: "Отчёты", reportFinancial: "Финансовый отчёт", reportSales: "Продажи",
    reportPurchases: "Покупки", reportIncomeExpense: "Доходы и расходы", reportStock: "Остатки",
    reportCashflow: "Движение денежных средств", reportReceivables: "Дебиторская задолженность",
    reportPayables: "Кредиторская задолженность",
    settings: "Настройки", company: "Компания", profile: "Профиль", language: "Язык", currency: "Валюта",
    notifications: "Уведомления", admin: "Admin Panel", logout: "Выйти", main: "Главная",
    balance: "Баланс", profit: "Прибыль", receivables: "Деб. задолженность", payables: "Кред. задолженность",

/* ============================================================
   PART 5: UTILITIES
   ============================================================ */
const UTIL = {
  uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); },
  escapeHtml(str){
    if(str === null || str === undefined) return "";
    return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  },
  formatMoney(amount, currency){
    const n = Number(amount) || 0;
    const symbols = {TJS:"SM", RUB:"₽", USD:"$"};
    return n.toLocaleString(STATE.lang === "ru" ? "ru-RU" : STATE.lang === "zh" ? "zh-CN" : "en-US", {minimumFractionDigits:2, maximumFractionDigits:2}) + " " + (symbols[currency] || currency || "");
  },
  formatDate(d){
    if(!d) return "—";
    const date = d.toDate ? d.toDate() : (d instanceof Date ? d : new Date(d));
    if(isNaN(date)) return "—";
    return date.toLocaleDateString(STATE.lang === "ru" ? "ru-RU" : STATE.lang === "zh" ? "zh-CN" : "en-US");
  },
  todayISO(){ return new Date().toISOString().slice(0,10); },
  convert(amount, from, to){
    if(from === to) return amount;
    const rates = STATE.exchangeRates; // all relative to TJS
    if(!rates[from] || !rates[to]) return null; // not set -> do not auto-convert
    const inTjs = amount * rates[from];
    return inTjs / rates[to];
  },
  debounce(fn, ms){
    let h; return (...args)=>{ clearTimeout(h); h = setTimeout(()=>fn(...args), ms); };
  },
  initials(first, last){
    return ((first||"?")[0] + (last||"")[0]).toUpperCase();
  }
};

/* ============================================================
   PART 6: NOTIFICATIONS (TOAST SYSTEM)
   ============================================================ */
const TOAST_ICONS = {success:"✓", error:"✕", warning:"⚠", info:"ℹ"};
function toast(type, title, msg){
  const stack = document.getElementById("toastStack");
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.innerHTML = `
    <div style="font-size:16px;line-height:1;margin-top:1px;">${TOAST_ICONS[type]||"ℹ"}</div>
    <div>
      <div class="toast-title">${UTIL.escapeHtml(title)}</div>
      ${msg ? `<div class="toast-msg">${UTIL.escapeHtml(msg)}</div>` : ""}
    </div>`;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translateX(24px)"; setTimeout(()=>el.remove(), 200); }, 3800);
}

/* ============================================================
   PART 7: MODAL SYSTEM
   ============================================================ */
function openModal({title, bodyHtml, large, footerHtml, onMount}){
  closeModal();
  const root = document.getElementById("modalRoot");
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "activeModal";
  overlay.innerHTML = `
    <div class="modal ${large?'modal-lg':''}">
      <div class="modal-head">
        <div class="modal-title">${UTIL.escapeHtml(title)}</div>
        <button class="icon-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      ${footerHtml ? `<div class="modal-foot">${footerHtml}</div>` : ""}
    </div>`;
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeModal(); });
  root.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add("show"));
  if(onMount) onMount();
}
function closeModal(){
  const el = document.getElementById("activeModal");
  if(!el) return;
  el.classList.remove("show");
  setTimeout(()=> el.remove(), 180);
}
function confirmDelete(message, onConfirm){
  openModal({
    title: t("areYouSure"),
    bodyHtml: `<p class="text-dim">${UTIL.escapeHtml(message || t("deleteConfirmMsg"))}</p>`,
    footerHtml: `
      <button class="btn btn-secondary" onclick="closeModal()">${t("cancel")}</button>
      <button class="btn btn-danger" id="confirmDeleteBtn">${t("delete")}</button>`,
    onMount(){
      document.getElementById("confirmDeleteBtn").onclick = async ()=>{
        await onConfirm();
        closeModal();
      };
    }
  });
}

/* ============================================================
   PART 9: AUTH MODULE
   ============================================================ */
const AUTH = {
  regTemp: null, // holds {firstName,lastName,login,password,telegramUsername} while awaiting telegram code

  async init(){
    render("splash");
    if(DEMO_MODE){
      seedDemoData();
      setTimeout(()=>{
        const savedUid = localStorage.getItem("ledgerly_demo_uid");
        if(savedUid){
          STATE.user = STATE.cache.users.find(u=>u.uid===savedUid) || STATE.cache.users[1];
          navigate("dashboard");
        } else {
          navigate("login");
        }
      }, 900);
      return;
    }
    auth.onAuthStateChanged(async (fbUser)=>{
      if(fbUser){
        const tokenResult = await fbUser.getIdTokenResult();
        STATE.claims = tokenResult.claims;
        const snap = await db.collection("users").doc(fbUser.uid).get();
        if(snap.exists){
          STATE.user = {uid: fbUser.uid, ...snap.data()};
          STATE.lang = STATE.user.lang || STATE.lang;
          STATE.currency = STATE.user.currency || STATE.currency;
          DB.attachListeners();
          navigate("dashboard");
        } else {
          navigate("login");
        }
      } else {
        STATE.user = null;
        navigate("login");
      }
    });
  },

  async login(login, password){
    if(DEMO_MODE){
      const u = STATE.cache.users.find(x=>x.login.toLowerCase()===login.toLowerCase());
      if(!u || password.length < 3) throw new Error(t("toastError"));
      if(u.status === "blocked") throw new Error("Account blocked");
      STATE.user = u;
      localStorage.setItem("ledgerly_demo_uid", u.uid);
      AUDIT.log("login", u.uid);
      navigate("dashboard");
      return;
    }
    // Firebase Authentication requires an email; logins are mapped to a
    // synthetic email address `login@<projectId>.ledgerly` at registration time.
    const email = login.includes("@") ? login : `${login}@${firebaseConfig.projectId}.ledgerly`;
    await auth.signInWithEmailAndPassword(email, password);
  },

  async requestTelegramCode(regData){
    // regData = {firstName,lastName,login,password,telegramUsername}
    this.regTemp = regData;
    if(DEMO_MODE){
      toast("info", t("codeSentTo"), "Demo code: 123456");
      return;
    }
    // Calls the protected Cloud Function; the real Telegram Bot Token never
    // touches the frontend. See "PART 39: TELEGRAM CLOUD FUNCTION" in chat.
    const sendCode = functions.httpsCallable("requestTelegramVerification");
    await sendCode({ telegramUsername: regData.telegramUsername, login: regData.login });
  },

  async verifyAndRegister(code){
    const d = this.regTemp;
    if(!d) throw new Error("No pending registration");
    if(DEMO_MODE){
      if(code !== "123456") throw new Error(t("toastInvalidCode"));
      const uid = UTIL.uid();
      const newUser = {
        uid, firstName:d.firstName, lastName:d.lastName, login:d.login,
        role:"user", status:"active", telegramId:d.telegramUsername,
        lang: STATE.lang, currency: STATE.currency, createdAt:new Date()
      };
      STATE.cache.users.push(newUser);
      STATE.user = newUser;
      localStorage.setItem("ledgerly_demo_uid", uid);
      AUDIT.log("registration", uid);
      navigate("dashboard");
      return;
    }
    // Verifies the one-time code via Cloud Function (checks expiry + attempt
    // limit server-side), then creates the Firebase Auth user + Firestore profile.
    const verify = functions.httpsCallable("verifyTelegramCode");
    const result = await verify({ login: d.login, code });
    if(!result.data || !result.data.valid) throw new Error(t("toastInvalidCode"));
    const email = `${d.login}@${firebaseConfig.projectId}.ledgerly`;
    const cred = await auth.createUserWithEmailAndPassword(email, d.password);
    await db.collection("users").doc(cred.user.uid).set({
      firstName: d.firstName, lastName: d.lastName, login: d.login,
      telegramId: d.telegramUsername, role: "user", status: "active",
      lang: STATE.lang, currency: STATE.currency,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    AUDIT.log("registration", cred.user.uid);
  },

  async logout(){
    AUDIT.log("logout", STATE.user && STATE.user.uid);
    DB.detachListeners();
    if(DEMO_MODE){
      localStorage.removeItem("ledgerly_demo_uid");

/* ============================================================
   PART 11: DATABASE (generic Firestore <-> DEMO cache bridge)
   ============================================================ */
const COLLECTION_TO_CACHE_KEY = {
  products:"products", categories:"categories", customers:"customers", suppliers:"suppliers",
  sales:"sales", purchases:"purchases", income:"income", expenses:"expenses",
  cash_transactions:"cashTx", bank_transactions:"bankTx", documents:"documents",
  users:"users", notifications:"notifications", audit_logs:"auditLogs"
};
const DB = {
  attachListeners(){
    if(DEMO_MODE || !STATE.user) return;
    const companyId = STATE.user.uid; // single-tenant per user in this scaffold; see security rules for company scoping
    Object.entries(COLLECTION_TO_CACHE_KEY).forEach(([col, cacheKey])=>{
      if(col === "users" || col === "audit_logs") return; // loaded on-demand (admin only)
      const unsub = db.collection(col).where("createdBy","==", companyId)
        .onSnapshot(snap=>{
          STATE.cache[cacheKey] = snap.docs.map(d=>({id:d.id, ...d.data()}));
          if(["dashboard","products","categories","customers","sales","purchases","income","expenses","cash","bank","documents","reports"].includes(STATE.route)){
            render(STATE.route);
          }
        }, err=>console.warn("listener error", col, err));
      STATE.unsub.push(unsub);
    });
    db.collection("exchange_rates").doc("current").onSnapshot(snap=>{
      if(snap.exists) STATE.exchangeRates = snap.data();
    });
  },
  detachListeners(){
    STATE.unsub.forEach(u=>u());
    STATE.unsub = [];
  },
  async add(col, data){
    const now = DEMO_MODE ? new Date() : firebase.firestore.FieldValue.serverTimestamp();
    const payload = {...data, createdAt: now, updatedAt: now, createdBy: STATE.user.uid};
    if(DEMO_MODE){
      const id = UTIL.uid();
      STATE.cache[COLLECTION_TO_CACHE_KEY[col]].unshift({id, ...payload, createdAt:new Date(), updatedAt:new Date()});
      return id;
    }
    const ref = await db.collection(col).add(payload);
    AUDIT.log("create:"+col, ref.id);
    return ref.id;
  },
  async update(col, id, data){
    const now = DEMO_MODE ? new Date() : firebase.firestore.FieldValue.serverTimestamp();
    if(DEMO_MODE){
      const arr = STATE.cache[COLLECTION_TO_CACHE_KEY[col]];
      const idx = arr.findIndex(x=>x.id===id);
      if(idx>-1) arr[idx] = {...arr[idx], ...data, updatedAt:new Date()};
      return;
    }
    await db.collection(col).doc(id).update({...data, updatedAt: now});
    AUDIT.log("update:"+col, id);
  },
  async remove(col, id){
    if(DEMO_MODE){
      const key = COLLECTION_TO_CACHE_KEY[col];
      STATE.cache[key] = STATE.cache[key].filter(x=>x.id!==id);
      return;
    }
    await db.collection(col).doc(id).delete();
    AUDIT.log("delete:"+col, id);
  }
};

function periodFilterDates(period){
  const now = new Date();
  let from = new Date(now);
  if(period==="today"){ from.setHours(0,0,0,0); }
  else if(period==="week"){ from.setDate(now.getDate()-7); }
  else if(period==="month"){ from.setMonth(now.getMonth()-1); }
  else if(period==="quarter"){ from.setMonth(now.getMonth()-3); }
  else if(period==="year"){ from.setFullYear(now.getFullYear()-1); }
  return {from, to: now};
}
let dashboardPeriod = "month";
function sumBy(arr, field, currency){
  return arr.reduce((s,x)=>{
    if(currency && x.currency && x.currency !== currency){
      const conv = UTIL.convert(x[field]||0, x.currency, currency);
      return s + (conv===null ? 0 : conv);
    }
    return s + (Number(x[field])||0);
  },0);
}
function renderDashboard(){
  const cur = STATE.currency;
  const totalIncome = sumBy(STATE.cache.income, "amount", cur);
  const totalExpenses = sumBy(STATE.cache.expenses, "amount", cur);
  const totalSales = sumBy(STATE.cache.sales, "total", cur);
  const receivables = sumBy(STATE.cache.sales.filter(s=>s.status==="draft"||s.status==="partial"), "total", cur);
  const payables = sumBy(STATE.cache.purchases.filter(p=>p.status==="draft"||p.status==="partial"), "total", cur);
  const profit = totalIncome - totalExpenses;
  const balance = sumBy(STATE.cache.cashTx.filter(x=>x.type==="in"),"amount",cur) - sumBy(STATE.cache.cashTx.filter(x=>x.type==="out"),"amount",cur);

  const cards = [
    {label:t("balance"), value:balance, ic:"💼", color:"var(--brand)"},
    {label:t("income"), value:totalIncome, ic:"💰", color:"var(--success)"},
    {label:t("expenses"), value:totalExpenses, ic:"💸", color:"var(--danger)"},
    {label:t("profit"), value:profit, ic:"📈", color:"var(--info)"},

function mountDashboardCharts(){
  const {from} = periodFilterDates(dashboardPeriod);

  if(lineCtx){
    const days = 7;
    const labels = Array.from({length:days},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(days-1-i)); return d.toLocaleDateString(STATE.lang,{day:'2-digit',month:'2-digit'}); });
    new Chart(lineCtx, {
      type:'line',
      data:{ labels, datasets:[
        {label:t('income'), data:labels.map(()=>Math.round(Math.random()*3000+500)), borderColor:'#16a34a', backgroundColor:'rgba(22,163,74,.08)', tension:.35, fill:true},
        {label:t('expenses'), data:labels.map(()=>Math.round(Math.random()*2000+300)), borderColor:'#e0344c', backgroundColor:'rgba(224,52,76,.08)', tension:.35, fill:true},
      ]},
      options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}}}, scales:{y:{beginAtZero:true}} }
    });
  }
  const donutCtx = document.getElementById("dashDonutChart");
  if(donutCtx){
    const byStatus = {};
    STATE.cache.sales.forEach(s=>{ byStatus[s.status||'draft'] = (byStatus[s.status||'draft']||0) + (s.total||0); });
    const labels = Object.keys(byStatus).length?Object.keys(byStatus):[t('noDataGeneric')];
    const data = Object.keys(byStatus).length?Object.values(byStatus):[1];
    new Chart(donutCtx, { type:'doughnut', data:{labels:labels.map(s=>t(s)||s), datasets:[{data, backgroundColor:['#4f5fff','#16a34a','#e2a336','#e0344c','#2f8fe0']}]}, options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:11}}}}} });
  }
}
function statusBadge(status){
  const map = {draft:"badge-gray", paid:"badge-success", partial:"badge-warn", cancelled:"badge-danger",
    active:"badge-success", inactive:"badge-gray", blocked:"badge-danger", connected:"badge-success", disconnected:"badge-gray", error:"badge-danger"};
  return `<span class="badge ${map[status]||'badge-gray'}">${t(status)||status}</span>`;
}
function emptyState(emoji, title, desc, actionHtml){
  return `<div class="empty-state"><div class="emoji">${emoji}</div><h3>${title}</h3><p>${desc}</p>${actionHtml||""}</div>`;

/* ============================================================
   PART 16: GENERIC CRUD MODULE FACTORY
   Every accounting list (products, sales, purchases, income...) shares the
   same toolbar / table / modal-form / delete-confirm pattern, so it is
   built once here and configured per-module below.
   ============================================================ */
let crudSearchTerm = {};
let crudStatusFilter = {};
function makeCrudModule(cfg){
  // cfg: {key, collection, cacheKey, titleKey, addLabelKey, emptyKey, columns:[{key,labelKey,render?}],
  //       fields:[{key,labelKey,type,required,options?}], searchFields:[...], statusOptions?:[...], computeTotal? }
  crudSearchTerm[cfg.key] = crudSearchTerm[cfg.key] || "";
  return {
    renderList(){
      let rows = STATE.cache[cfg.cacheKey] || [];
      const term = (crudSearchTerm[cfg.key]||"").toLowerCase();
      if(term){
        rows = rows.filter(r => cfg.searchFields.some(f => (r[f]||"").toString().toLowerCase().includes(term)));
      }
      const statusF = crudStatusFilter[cfg.key];
      if(statusF && statusF !== "all"){ rows = rows.filter(r=>r.status===statusF); }
      return `
        <div class="page-header">
          <div><div class="page-title">${t(cfg.titleKey)}</div><div class="page-sub">${rows.length} ${t('total').toLowerCase()==='total'?'':''}</div></div>
          <button class="btn btn-primary" onclick="CRUD.${cfg.key}.openForm()">+ ${t(cfg.addLabelKey)}</button>
        </div>
        <div class="card card-pad">
          <div class="toolbar">
            <div class="grow"><input placeholder="${t('search')}" value="${UTIL.escapeHtml(crudSearchTerm[cfg.key])}" oninput="crudSearchTerm['${cfg.key}']=this.value;render(STATE.route)"></div>
            ${cfg.statusOptions ? `<div class="chip-filter">
              <button class="chip ${(!statusF||statusF==='all')?'active':''}" onclick="crudStatusFilter['${cfg.key}']='all';render(STATE.route)">${t('allStatuses')}</button>
              ${cfg.statusOptions.map(s=>`<button class="chip ${statusF===s?'active':''}" onclick="crudStatusFilter['${cfg.key}']='${s}';render(STATE.route)">${t(s)}</button>`).join("")}
            </div>` : ""}
          </div>
          ${rows.length ? `
          <div class="table-wrap"><table>
            <thead><tr>${cfg.columns.map(c=>`<th>${t(c.labelKey)}</th>`).join("")}<th style="text-align:right;">${t('actions')}</th></tr></thead>
            <tbody>${rows.map(r=>`<tr>
              ${cfg.columns.map(c=>`<td>${c.render ? c.render(r) : UTIL.escapeHtml(r[c.key] ?? "—")}</td>`).join("")}
              <td><div class="row-actions" style="justify-content:flex-end;">
                <button class="btn btn-ghost btn-icon btn-sm" title="${t('edit')}" onclick='CRUD.${cfg.key}.openForm(${JSON.stringify(r.id)})'>✏️</button>
                <button class="btn btn-ghost btn-icon btn-sm" title="${t('delete')}" onclick='CRUD.${cfg.key}.remove(${JSON.stringify(r.id)})'>🗑️</button>
              </div></td>
            </tr>`).join("")}</tbody>
          </table></div>` : emptyState("🗂️", t("noDataTitle"), t(cfg.emptyKey)||t("noDataGeneric"), `<button class="btn btn-primary" onclick="CRUD.${cfg.key}.openForm()">+ ${t(cfg.addLabelKey)}</button>`)}
        </div>`;
    },
    openForm(id){
      const existing = id ? (STATE.cache[cfg.cacheKey]||[]).find(x=>x.id===id) : null;
      const bodyHtml = `
        <form id="crudForm-${cfg.key}">
          ${cfg.fields.map(f=>renderCrudField(f, existing)).join("")}
        </form>`;
      openModal({
        title: existing ? t('edit') : t(cfg.addLabelKey),
        large: cfg.large,
        bodyHtml,
        footerHtml: `<button class="btn btn-secondary" onclick="closeModal()">${t('cancel')}</button>
          <button class="btn btn-primary" id="crudSaveBtn-${cfg.key}">${t('save')}</button>`,
        onMount(){
          if(cfg.onFormMount) cfg.onFormMount(existing);
          document.getElementById(`crudSaveBtn-${cfg.key}`).onclick = async ()=>{
            const form = document.getElementById(`crudForm-${cfg.key}`);
            const data = {};
            let valid = true;
            cfg.fields.forEach(f=>{
              const el = form.querySelector(`[name="${f.key}"]`);
              if(!el) return;
              let val = f.type === "number" ? parseFloat(el.value||0) : el.value;
              if(f.required && (val === "" || val===null || val===undefined)){ el.classList.add("input-error"); valid=false; }
              else el.classList.remove("input-error");
              data[f.key] = val;
            });
            if(!valid){ toast("error", t("toastError")); return; }
            if(cfg.beforeSave) Object.assign(data, cfg.beforeSave(data));
            const btn = document.getElementById(`crudSaveBtn-${cfg.key}`);
            btn.disabled = true; btn.innerHTML = `<span class="spinner dark"></span>`;
            try{
              if(existing){ await DB.update(cfg.collection, existing.id, data); toast("success", t("toastUpdated")); }
              else { await DB.add(cfg.collection, data); toast("success", t("toastCreated")); }
              closeModal();
              if(DEMO_MODE) render(STATE.route);
            }catch(e){
              toast("error", t("toastError"), e.message);
              btn.disabled = false; btn.innerHTML = t("save");
            }
          };
        }
      });
    },
    remove(id){
      confirmDelete(null, async ()=>{
        try{ await DB.remove(cfg.collection, id); toast("success", t("toastDeleted")); if(DEMO_MODE) render(STATE.route); }
        catch(e){ toast("error", t("toastError"), e.message); }
      });
    }
  };
}
function renderCrudField(f, existing){
  const val = existing ? (existing[f.key] ?? "") : (f.default ?? "");
  if(f.type === "select"){
    return `<div class="field"><label>${t(f.labelKey)}</label>
      <select name="${f.key}">${f.options.map(o=>`<option value="${o.value}" ${val===o.value?'selected':''}>${t(o.labelKey)||o.labelKey}</option>`).join("")}</select></div>`;
  }
  if(f.type === "textarea"){
    return `<div class="field"><label>${t(f.labelKey)}</label><textarea name="${f.key}" rows="3">${UTIL.escapeHtml(val)}</textarea></div>`;
  }
  return `<div class="field"><label>${t(f.labelKey)}</label><input name="${f.key}" type="${f.type||'text'}" value="${UTIL.escapeHtml(val)}" ${f.step?`step="${f.step}"`:''}></div>`;
}

// ---- Sales / Purchases shared form with line items + auto totals ----
function openSalesOrPurchaseForm(kind, id){
  const cacheKey = kind === "sales" ? "sales" : "purchases";
  const existing = id ? STATE.cache[cacheKey].find(x=>x.id===id) : null;
  const partyField = kind === "sales" ? "customerId" : "supplierId";
  const partyList = kind === "sales" ? STATE.cache.customers.filter(c=>c.type!=="supplier") : STATE.cache.customers.filter(c=>c.type!=="client");
  let lineItems = existing && existing.items ? JSON.parse(JSON.stringify(existing.items)) : [{productId:"", qty:1, price:0}];

  function itemsHtml(){
    return lineItems.map((li,idx)=>`
      <div class="flex gap-2 items-center mt-2" data-idx="${idx}">
        <select style="flex:2;" onchange="updateLineItem(${idx},'productId',this.value)">
          <option value="">—</option>
          ${STATE.cache.products.map(p=>`<option value="${p.id}" ${li.productId===p.id?'selected':''}>${UTIL.escapeHtml(p.name)}</option>`).join("")}
        </select>
        <input type="number" min="0" step="1" style="width:80px;" value="${li.qty}" placeholder="${t('quantity')}" oninput="updateLineItem(${idx},'qty',this.value)">
        <input type="number" min="0" step="0.01" style="width:100px;" value="${li.price}" placeholder="${t('price')}" oninput="updateLineItem(${idx},'price',this.value)">
        <button type="button" class="btn btn-ghost btn-icon btn-sm" onclick="removeLineItem(${idx})">🗑️</button>
      </div>`).join("");
  }
  window.updateLineItem = (idx, field, value)=>{
    lineItems[idx][field] = field==="productId" ? value : parseFloat(value)||0;
    if(field === "productId"){
      const p = STATE.cache.products.find(x=>x.id===value);
      if(p) lineItems[idx].price = p.price;
    }
    recalcTotals();
  };
  window.removeLineItem = (idx)=>{ lineItems.splice(idx,1); rerenderItems(); };
  function rerenderItems(){
    document.getElementById("lineItemsBox").innerHTML = itemsHtml();
    recalcTotals();
  }
  function recalcTotals(){
    const subtotal = lineItems.reduce((s,li)=> s + (li.qty*li.price), 0);
    const discountEl = document.querySelector('[name="discount"]');
    const discount = discountEl ? (parseFloat(discountEl.value)||0) : 0;
    const total = Math.max(0, subtotal - discount);
    document.getElementById("subtotalVal").textContent = UTIL.formatMoney(subtotal, STATE.currency);
    document.getElementById("totalVal").textContent = UTIL.formatMoney(total, STATE.currency);
  }

  const bodyHtml = `
    <form id="salesForm">
      <div class="form-row">
        <div class="field"><label>${t('number')}</label><input name="number" value="${UTIL.escapeHtml(existing?existing.number:('#'+Math.floor(1000+Math.random()*9000)))}"></div>
        <div class="field"><label>${t('date')}</label><input type="date" name="date" value="${existing? (existing.date.toDate?existing.date.toDate():new Date(existing.date)).toISOString().slice(0,10) : UTIL.todayISO()}"></div>
      </div>
      <div class="field">
        <label>${kind==="sales"?t('client'):t('supplier')}</label>
        <select name="${partyField}">
          <option value="">—</option>
          ${partyList.map(c=>`<option value="${c.id}" ${existing&&existing[partyField]===c.id?'selected':''}>${UTIL.escapeHtml(c.name)}</option>`).join("")}
        </select>
      </div>
      <label>${t('products')}</label>
      <div id="lineItemsBox">${itemsHtml()}</div>
      <button type="button" class="btn btn-secondary btn-sm mt-2" onclick="lineItems.push({productId:'',qty:1,price:0}); document.getElementById('lineItemsBox').innerHTML = (${itemsHtml.toString()})();">+ ${t('products')}</button>
      <div class="form-row mt-3">
        <div class="field"><label>${t('discount')}</label><input type="number" name="discount" min="0" step="0.01" value="${existing?existing.discount||0:0}" oninput="recalcSPTotals()"></div>
        <div class="field"><label>${t('currency')}</label><select name="currency">${CURRENCY_OPTIONS.map(o=>`<option value="${o.value}" ${(existing?existing.currency:STATE.currency)===o.value?'selected':''}>${o.value}</option>`).join("")}</select></div>
      </div>
      <div class="form-row">
        <div class="field"><label>${t('paymentMethod')}</label><select name="paymentMethod"><option value="cash">${t('cash')}</option><option value="bank">${t('bank')}</option></select></div>
        <div class="field"><label>${t('status')}</label><select name="status">
          ${["draft","paid","partial","cancelled"].map(s=>`<option value="${s}" ${(existing?existing.status:'draft')===s?'selected':''}>${t(s)}</option>`).join("")}
        </select></div>
      </div>
      <div class="divider"></div>
      <div class="kv"><span class="k">${t('subtotal')}</span><span id="subtotalVal">—</span></div>
      <div class="kv"><span class="k" style="font-weight:800;color:var(--text)">${t('total')}</span><span id="totalVal" style="font-weight:800;">—</span></div>
    </form>`;

  window.recalcSPTotals = recalcTotals;
  openModal({
    title: existing ? t('edit') : (kind==='sales'?t('newSale'):t('newPurchase')),
    large:true, bodyHtml,
    footerHtml: `<button class="btn btn-secondary" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-primary" id="spSaveBtn">${t('save')}</button>`,
    onMount(){
      recalcTotals();
      document.getElementById("spSaveBtn").onclick = async ()=>{
        const form = document.getElementById("salesForm");
        const subtotal = lineItems.reduce((s,li)=> s + (li.qty*li.price), 0);
        const discount = parseFloat(form.querySelector('[name="discount"]').value)||0;
        const data = {
          number: form.querySelector('[name="number"]').value,
          date: new Date(form.querySelector('[name="date"]').value),
          [partyField]: form.querySelector(`[name="${partyField}"]`).value,
          items: lineItems, subtotal, discount, total: Math.max(0, subtotal-discount),
          currency: form.querySelector('[name="currency"]').value,
          paymentMethod: form.querySelector('[name="paymentMethod"]').value,
          status: form.querySelector('[name="status"]').value,
        };
        const btn = document.getElementById("spSaveBtn");
        btn.disabled = true; btn.innerHTML = `<span class="spinner dark"></span>`;
        try{
          if(existing){ await DB.update(kind, existing.id, data); toast("success", t("toastUpdated")); }
          else { await DB.add(kind, data); toast("success", t("toastCreated")); }
          closeModal();
          if(DEMO_MODE) render(STATE.route);
        }catch(e){ toast("error", t("toastError"), e.message); btn.disabled=false; btn.innerHTML=t("save"); }
      };
    }
  });
}

function openCustomerForm(id, type){
  const existing = id ? STATE.cache.customers.find(x=>x.id===id) : null;
  const bodyHtml = `

      <div class="field"><label>${t('name')}</label><input name="name" value="${UTIL.escapeHtml(existing?existing.name:'')}"></div>

      </div>
      <div class="form-row">

      </div>
      <div class="field"><label>${t('address')}</label><input name="address" value="${UTIL.escapeHtml(existing?existing.address:'')}"></div>
      <div class="field"><label>${t('note')}</label><textarea name="note" rows="2">${UTIL.escapeHtml(existing?existing.note:'')}</textarea></div>
    </form>`;

    title: existing?t('edit'):(type==='client'?t('addCustomer'):type==='supplier'?t('addSupplier'):t('addCustomer')),

    footerHtml:`<button class="btn btn-secondary" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-primary" id="custSaveBtn">${t('save')}</button>`,
    onMount(){
      document.getElementById("custSaveBtn").onclick = async ()=>{
        const form = document.getElementById("custForm");
        const data = {type, name:form.name.value, contactPerson:form.contactPerson.value, phone:form.phone.value,
          email:form.email.value, telegram:form.telegram.value, address:form.address.value, note:form.note.value};

function openCashBankForm(kind, type){
  const col = kind === "cash" ? "cash_transactions" : "bank_transactions";
  const bodyHtml = `
    <form id="cbForm">
      <div class="form-row">
        <div class="field"><label>${t('incomeAmount')}</label><input name="amount" type="number" min="0" step="0.01"></div>
        <div class="field"><label>${t('currency')}</label><select name="currency">${CURRENCY_OPTIONS.map(o=>`<option value="${o.value}" ${STATE.currency===o.value?'selected':''}>${o.value}</option>`).join("")}</select></div>
      </div>
      <div class="form-row">
        <div class="field"><label>${t('date')}</label><input name="date" type="date" value="${UTIL.todayISO()}"></div>
        <div class="field"><label>${t('counterparty')}</label><select name="counterparty"><option value="">—</option>${STATE.cache.customers.map(c=>`<option value="${c.id}">${UTIL.escapeHtml(c.name)}</option>`).join("")}</select></div>
      </div>
      ${kind==='bank' && type==='out' ? `<div class="field"><label>${t('transfer')}</label><input name="isTransfer" type="checkbox" style="width:auto;"></div>` : ""}
      <div class="field"><label>${t('description')}</label><textarea name="description" rows="2"></textarea></div>
    </form>`;
  openModal({
    title: type==='in'?t('incomingOp'):t('outgoingOp'), bodyHtml,
    footerHtml:`<button class="btn btn-secondary" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-primary" id="cbSaveBtn">${t('save')}</button>`,
    onMount(){
      document.getElementById("cbSaveBtn").onclick = async ()=>{

function renderReportTable(){
  let rows = [];
  if(reportTab==="sales") rows = STATE.cache.sales.map(s=>({label:s.number, amount:s.total, currency:s.currency, date:s.date, status:s.status}));
  else if(reportTab==="purchases") rows = STATE.cache.purchases.map(p=>({label:p.number, amount:p.total, currency:p.currency, date:p.date, status:p.status}));
  else if(reportTab==="receivables") rows = STATE.cache.sales.filter(s=>s.status!=="paid"&&s.status!=="cancelled").map(s=>({label:s.number, amount:s.total, currency:s.currency, date:s.date, status:s.status}));
  else if(reportTab==="payables") rows = STATE.cache.purchases.filter(p=>p.status!=="paid"&&p.status!=="cancelled").map(p=>({label:p.number, amount:p.total, currency:p.currency, date:p.date, status:p.status}));
  else if(reportTab==="stock") rows = STATE.cache.products.map(p=>({label:p.name, amount:p.quantity, currency:p.unit, date:null, status:p.status}));
  else rows = [...STATE.cache.income.map(i=>({label:i.category, amount:i.amount, currency:i.currency, date:i.date})), ...STATE.cache.expenses.map(e=>({label:e.category, amount:-e.amount, currency:e.currency, date:e.date}))];
  if(!rows.length) return emptyState("📈", t("noDataTitle"), t("noDataGeneric"));
  return `<div class="table-wrap"><table><thead><tr><th>${t('name')}</th><th>${t('date')}</th><th style="text-align:right;">${t('total')}</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${UTIL.escapeHtml(r.label||'—')}</td><td>${r.date?UTIL.formatDate(r.date):'—'}</td><td style="text-align:right;font-weight:700;">${typeof r.currency==='string'&&['TJS','RUB','USD'].includes(r.currency)?UTIL.formatMoney(r.amount,r.currency):r.amount+' '+(r.currency||'')}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function mountReportsCharts(){
  const ctx = document.getElementById("reportChart");
  if(!ctx) return;
  const labels = STATE.lang==='ru'?['Янв','Фев','Мар','Апр','Май','Июн']:STATE.lang==='zh'?['1月','2月','3月','4月','5月','6月']:['Jan','Feb','Mar','Apr','May','Jun'];
  new Chart(ctx, {type:'bar', data:{labels, datasets:[{label:t(reportTab==='financial'?'profit':'total'), data:labels.map(()=>Math.round(Math.random()*8000+1000)), backgroundColor:'#4f5fff', borderRadius:6}]}, options:{plugins:{legend:{display:false}}}});
}

function adminToggleBlock(uid){
  const u = STATE.cache.users.find(x=>x.uid===uid);

  const newStatus = u.status==="blocked" ? "active" : "blocked";
  confirmDelete(newStatus==="blocked" ? (STATE.lang==='ru'?'Заблокировать пользователя?':'Block this user?') : (STATE.lang==='ru'?'Разблокировать пользователя?':'Unblock this user?'), async ()=>{
    u.status = newStatus;
    if(!DEMO_MODE) await db.collection("users").doc(uid).update({status:newStatus});
    AUDIT.log("admin:setStatus:"+newStatus, uid);
    toast("success", t("toastUpdated"));
    renderAdminSoft();
  });
}
function adminToggleRole(uid){
  const u = STATE.cache.users.find(x=>x.uid===uid);
  if(!u) return;
  const newRole = u.role==="admin" ? "user" : "admin";
  confirmDelete(STATE.lang==='ru'?`Изменить роль на "${newRole}"?`:`Change role to "${newRole}"?`, async ()=>{
    u.role = newRole;
    if(!DEMO_MODE){
      // Real admin-role changes must go through a Cloud Function that calls
      // admin.auth().setCustomUserClaims(uid, {admin:true}) — never trust a
      // client-side Firestore write alone to grant admin rights (see rules).
      const setRole = functions.httpsCallable("setUserRole");
      await setRole({uid, role:newRole});
    }
    AUDIT.log("admin:setRole:"+newRole, uid);
    toast("success", t("toastUpdated"));
    renderAdminSoft();
  });
}

    </div>
    <div class="card card-pad">
      <b>${t('exchangeRates')}</b>
      <div class="form-row mt-3">
        ${["TJS","RUB","USD"].map(c=>`
          <div class="field"><label>${c}</label><input type="number" step="0.0001" id="rate-${c}" value="${STATE.exchangeRates[c]||''}"></div>`).join("")}
      </div>
      <button class="btn btn-primary" onclick="saveExchangeRates()">${t('setRate')}</button>
      <p class="text-dim text-sm mt-2">${t('noConversionWarning')}</p>
    </div>`;
}
async function saveExchangeRates(){
  const rates = {};
  ["TJS","RUB","USD"].forEach(c=>{ rates[c] = parseFloat(document.getElementById("rate-"+c).value) || null; });
  STATE.exchangeRates = rates;
  if(!DEMO_MODE) await db.collection("exchange_rates").doc("current").set(rates);
  AUDIT.log("admin:setExchangeRates");
  toast("success", t("toastSaved"));
}
function renderAdminTelegram(){
  const cfg = STATE.telegramSettings || {botUsername:"", verificationEnabled:true, codeLifetime:10, maxAttempts:5, status:"disconnected"};
  return `
    <div class="card card-pad" style="max-width:520px;">
      <div class="flex justify-between items-center mb-3"><b>Telegram Bot Settings</b>${statusBadge(cfg.status)}</div>
      <form id="tgForm">
        <div class="field"><label>${t('botUsername')}</label><input name="botUsername" value="${UTIL.escapeHtml(cfg.botUsername)}" placeholder="@ledgerly_bot"></div>
        <div class="field"><label>${t('botToken')}</label><input name="botToken" type="password" placeholder="${STATE.lang==='ru'?'Хранится только в Secret Manager':'Stored only in Secret Manager'}" disabled></div>
        <p class="text-dim text-sm mt-2" style="margin-bottom:14px;">${STATE.lang==='ru'?'Токен никогда не передаётся в браузер. Он задаётся напрямую в Firebase Secret Manager и используется только Cloud Function.':STATE.lang==='zh'?'令牌永远不会发送到浏览器。它直接在 Firebase Secret Manager 中设置，仅由 Cloud Function 使用。':'The token never reaches the browser. It is set directly in Firebase Secret Manager and used only by the Cloud Function.'}</p>
        <div class="form-row">
          <div class="field"><label>${t('codeLifetime')}</label><input name="codeLifetime" type="number" value="${cfg.codeLifetime}"></div>
          <div class="field"><label>${t('maxAttempts')}</label><input name="maxAttempts" type="number" value="${cfg.maxAttempts}"></div>
        </div>
        <div class="field flex items-center gap-2"><input type="checkbox" name="verificationEnabled" style="width:auto;" ${cfg.verificationEnabled?'checked':''}><label style="margin:0;">${t('verificationEnabled')}</label></div>
        <div class="flex gap-2 mt-2">
          <button type="submit" class="btn btn-primary">${t('save')}</button>
          <button type="button" class="btn btn-secondary" onclick="testTelegramBot()">${t('testBot')}</button>
        </div>
      </form>
    </div>`;
}
function bindAdminPage(){
  const tgf = document.getElementById("tgForm");
  if(tgf) tgf.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const cfg = {
      botUsername: tgf.botUsername.value, codeLifetime: parseInt(tgf.codeLifetime.value)||10,
      maxAttempts: parseInt(tgf.maxAttempts.value)||5, verificationEnabled: tgf.verificationEnabled.checked,
      status: STATE.telegramSettings?.status || "disconnected"
    };
    STATE.telegramSettings = cfg;
    if(!DEMO_MODE) await db.collection("settings").doc("telegram").set(cfg, {merge:true});
    AUDIT.log("admin:setTelegramSettings");
    toast("success", t("toastSaved"));
  });
}
async function testTelegramBot(){
  toast("info", t("testBot"), "...");
  if(DEMO_MODE){ setTimeout(()=>toast("success", t("connected")), 700); return; }
  try{
    const testFn = functions.httpsCallable("testTelegramBot");
    const res = await testFn();
    STATE.telegramSettings = {...(STATE.telegramSettings||{}), status: res.data.ok ? "connected" : "error"};
    toast(res.data.ok ? "success" : "error", res.data.ok ? t("connected") : t("error"));
    renderAdminSoft();
  }catch(e){ toast("error", t("error"), e.message); }
}
function renderAdminSystem(){
  return `
    <div class="card card-pad" style="max-width:520px;">
      <b>${t('system')}</b>
      <div class="kv mt-3"><span class="k">${t('language')}</span><span>RU / EN / ZH</span></div>
      <div class="kv"><span class="k">${t('currency')}</span><span>TJS / RUB / USD</span></div>
      <div class="kv"><span class="k">Firestore</span><span>${DEMO_MODE?'DEMO':'Connected'}</span></div>
    </div>`;
}

  AUTH.init();
});
